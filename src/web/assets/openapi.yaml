openapi: "3.1.0"
info:
  title: Credimi EUDI Trusted Lists API
  description: >-
    API for published TS 119 602 JSON Lists of Trusted Entities: PID Providers
    (Annex D), Wallet Providers (Annex E), WRPAC Providers (Annex F) and WRPRC
    Providers (Annex G). Reading is public; Trusted List creation requires the
    administrator token.
  version: "0.1.0"
  contact:
    name: Credimi
    url: https://github.com/ForkbombEu/eudi-trusted-list-publisher
servers:
  - url: /
    description: Same-origin
paths:
  /api/v1/lists:
    get:
      summary: List all published lists
      operationId: listLists
      responses:
        "200":
          description: Array of published list summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists:
                    type: array
                    items:
                      $ref: "#/components/schemas/ListSummary"
  /api/v1/lists/{listKey}:
    get:
      summary: Get list index
      operationId: getList
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List index with all versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexEntry"
        "404":
          description: List not found
  /api/v1/lists/{listKey}/versions/{sequence}:
    get:
      summary: Get version manifest
      operationId: getVersion
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: sequence
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Version manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "404":
          description: Version not found
  /api/v1/lists/{listKey}/versions/{sequence}/lote:
    get:
      summary: Download decoded LoTE JSON
      operationId: getLoteJson
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: sequence
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: LoTE JSON artifact
          content:
            application/json: {}
  /api/v1/lists/{listKey}/versions/{sequence}/signature:
    get:
      summary: Download Compact JAdES signature artifact
      operationId: getSignature
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: sequence
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compact JAdES artifact
          content:
            application/octet-stream: {}
  /api/v1/lists/{listKey}/versions/{sequence}/manifest:
    get:
      summary: Download publication manifest
      operationId: getManifest
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: sequence
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Publication manifest JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
  /api/v1/lists/{listKey}/versions/{sequence}/trusted-list.xml:
    get:
      summary: Download the signed XML Trusted List of a version
      description: >-
        The TS 119 612 artifact of one immutable version, served as
        application/vnd.etsi.tsl+xml. Its enveloped XAdES-B-B signature is
        inside the document, so there is no separate signature file. Returns
        404 for a TS 119 602 list, whose artifacts are the JSON LoTE and its
        detached Compact JAdES.
      operationId: getTrustedListXml
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: sequence
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The signed XML Trusted List
          content:
            application/vnd.etsi.tsl+xml: {}
        "404":
          description: Not an XML Trusted List, or no such version
          content:
            application/json: {}
  /api/v1/lists/{listKey}/versions/{sequence}/trusted-list.sha2:
    get:
      summary: Download the SHA-256 digest of the published XML bytes
      description: >-
        The lowercase hexadecimal SHA-256 of the exact bytes served at
        trusted-list.xml for the same version, and nothing else.
      operationId: getTrustedListSha2
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: sequence
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The SHA-256 digest, as 64 hexadecimal characters
          content:
            text/plain: {}
        "404":
          description: Not an XML Trusted List, or no such version
          content:
            application/json: {}
  /lists/{listKey}/latest/trusted-list.xml:
    get:
      summary: The current signed XML Trusted List, at a stable URL
      description: >-
        Always the newest version of the list. The URL does not change when a
        version is published, so a consumer can poll one address. It is served
        inline, rather than as an attachment.
      operationId: getLatestTrustedListXml
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The signed XML Trusted List of the newest version, displayed inline
          content:
            application/vnd.etsi.tsl+xml: {}
        "404":
          description: No XML Trusted List is published under this key
  /lists/{listKey}/latest/lote.json:
    get:
      summary: Open the current JSON LoTE in the browser
      description: >-
        Always the newest ETSI TS 119 602 JSON LoTE for this list. It is served
        inline, rather than as an attachment. Returns 404 for a TS 119 612 XML
        Trusted List because that standard publishes trusted-list.xml instead.
      operationId: getLatestLoteJson
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The newest JSON LoTE, displayed inline
          content:
            application/json: {}
        "404":
          description: No JSON LoTE is published under this key
  /lists/{listKey}/latest/lote.jades:
    get:
      summary: Open the current Compact JAdES in the browser
      description: >-
        Always the newest ETSI TS 119 602 Compact JAdES for this list. It is
        served as inline plain text, rather than as an attachment. Returns 404
        for a TS 119 612 XML Trusted List because its signature is enveloped.
      operationId: getLatestLoteJades
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The newest Compact JAdES, displayed inline
          content:
            text/plain: {}
        "404":
          description: No Compact JAdES is published under this key
  /lists/{listKey}/latest/trusted-list.sha2:
    get:
      summary: The SHA-256 of the current XML Trusted List, at a stable URL
      operationId: getLatestTrustedListSha2
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The SHA-256 digest of the newest version's XML bytes
          content:
            text/plain: {}
        "404":
          description: No XML Trusted List is published under this key
  /api/v1/lists/{listKey}/versions/{sequence}/xml:
    get:
      summary: Open the XML rendition of a TS 119 602 version, when one exists
      description: >-
        A TS 119 602 JSON list may have an XML rendition placed beside its
        artifacts; this publisher does not produce one, so it normally returns
        404. This is not the TS 119 612 route: an XML Trusted List is served at
        trusted-list.xml. Add download=1 to save it instead of opening it.
      operationId: getLoteXml
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: sequence
          in: path
          required: true
          schema:
            type: integer
        - name: download
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: XML rendition of the published LoTE
          content:
            application/xml: {}
        "404":
          description: No XML rendition is published for this version
          content:
            application/json: {}
  /api/v1/lists/{listKey}/versions/{sequence}/inspector:
    get:
      summary: Download the stored Trust Inspector evaluation
      description: >-
        The complete external assessment of this version's signed artifact:
        the Compact JAdES for an ETSI TS 119 602 list, the signed XML Trusted
        List for an ETSI TS 119 612 one. A 404 means no evaluation is stored,
        which is reported as Unavailable and is not a statement about
        conformance. An evaluation whose summary status is unavailable means the
        Inspector reached no verdict — because it could not be contacted, or
        because it did not apply the submitted standard to the artifact — and
        must never be read as a pass. Add view=1 to render it in the browser
        instead of downloading it.
      operationId: getInspectorEvaluation
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: sequence
          in: path
          required: true
          schema:
            type: integer
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Stored Trust Inspector evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectorEvaluation"
        "404":
          description: No evaluation is stored for this version
  /api/v1/admin/lists:
    post:
      summary: Create a Trusted List and publish its first version
      description: >-
        Declares an ETSI TS 119 602 Trusted List, publishes version 1 signed as
        Compact JAdES, and stores the Trust Inspector evaluation beside it.
        Requires the administrator token, sent either as a bearer Authorization
        header or as the token query parameter. Selecting defects publishes an
        intentionally broken test fixture instead, and the response carries the
        fixture evidence. Use /api/v1/admin/trusted-lists for a TS 119 612 XML
        Trusted List.
      operationId: createTrustedList
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrustedListRequest"
      responses:
        "201":
          description: Trusted List created and version 1 published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTrustedListResponse"
        "400":
          description: The request was rejected; the message says why
        "403":
          description: Missing or invalid administrator token
  /api/v1/lists/{listKey}/versions/{sequence}/fixture:
    get:
      summary: Download the negative-fixture evidence of one version
      description: >-
        What an intentionally broken version was asked to be and what actually
        happened: the selected defects, the mutations that were applied and at
        which stage, and the expected, actual, matched, missing and additional
        failures on both the local and the Trust Inspector axis. The document
        has the same shape for both standards. A 404 means this version is not
        an intentionally broken test fixture. Add view=1 to render it in the
        browser instead of downloading it.
      operationId: getFixtureMetadata
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: sequence
          in: path
          required: true
          schema:
            type: integer
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Stored negative-fixture evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixtureMetadata"
        "404":
          description: This version is not an intentionally broken test fixture
  /api/v1/admin/trusted-lists:
    post:
      summary: Create an XML Trusted List and publish its first version
      description: >-
        Declares an ETSI TS 119 612 national Trusted List, publishes version 1
        signed as XAdES-B-B, and stores the Trust Inspector evaluation beside
        it. The API counterpart of Admin -> Create XML Trusted List: the same
        fields, the same artifacts and the same fixture evidence. Selecting
        defects publishes an intentionally broken test fixture. Requires the
        administrator token.
      operationId: createXmlTrustedList
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateXmlTrustedListRequest"
      responses:
        "201":
          description: Trusted List created and version 1 published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateXmlTrustedListResponse"
        "400":
          description: The request was rejected; the message says why
        "403":
          description: Missing or invalid administrator token
        "404":
          description: This server has no signing configuration
components:
  schemas:
    ListSummary:
      type: object
      properties:
        listKey:
          type: string
        versionCount:
          type: integer
        latestSequenceNumber:
          type: integer
        latestIssueDate:
          type: string
        latestNextUpdate:
          type: string
    IndexEntry:
      type: object
      properties:
        listKey:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/IndexVersionEntry"
    IndexVersionEntry:
      type: object
      properties:
        sequenceNumber:
          type: integer
        issueDate:
          type: string
        nextUpdateDate:
          type: string
        publicationTimestamp:
          type: string
        compactJadesSha256:
          type: string
        loteJsonSha256:
          type: string
        signatureValid:
          type: boolean
        etsiSchemaValid:
          type: boolean
        signerTrustStatus:
          type: string
    Manifest:
      type: object
      properties:
        manifestVersion:
          type: integer
        listKey:
          type: string
        loteIdentifier:
          type: string
        sequenceNumber:
          type: integer
        issueDate:
          type: string
        nextUpdateDate:
          type: string
        loteType:
          type: string
        schemeOperatorName:
          type: string
        territory:
          type: string
        publicationTimestamp:
          type: string
        compactJadesSha256:
          type: string
        loteJsonSha256:
          type: string
        signingCertificateSha256:
          type: string
        certificateSubject:
          type: string
        certificateIssuer:
          type: string
        certificateValidFrom:
          type: string
        certificateValidTo:
          type: string
        signatureValid:
          type: boolean
        etsiSchemaValid:
          type: boolean
        signerTrustStatus:
          type: string
    CreateTrustedListRequest:
      type: object
      required:
        - family
        - schemeName
        - schemeOperatorName
        - schemeTerritory
        - schemeOperatorStreet
        - schemeOperatorCountry
        - schemeOperatorEmail
        - baseUrl
        - keyFile
        - certFile
      properties:
        family:
          type: string
          enum:
            [
              pid-providers,
              wallet-providers,
              wrpac-providers,
              wrprc-providers,
              pub-eaa-providers,
            ]
        schemeName:
          type: string
          description: Name of the Trusted List, published as SchemeName.
        schemeOperatorName:
          type: string
          description: >-
            Must be unique within the territory; the publication list key is
            derived from the territory and this name, and the signing
            certificate's subject organisation must equal it.
        schemeTerritory:
          type: string
          example: EU
        schemeOperatorStreet:
          type: string
        schemeOperatorCountry:
          type: string
          example: IT
        schemeOperatorEmail:
          type: string
        baseUrl:
          type: string
          description: >-
            The website, scheme information, policy and distribution URIs are
            derived from it.
        keyFile:
          type: string
          description: Server-side path to the signing private key.
        certFile:
          type: string
          description: Server-side path to the signing certificate.
        defects:
          type: array
          description: >-
            Deliberate defect IDs from the canonical catalogue. Empty publishes
            a healthy list; a non-empty array publishes an intentionally broken
            test fixture whose failing Trust Inspector verdict is the expected
            outcome. Only IDs the catalogue binds to ETSI TS 119 602 are
            accepted here; an unknown one is rejected by name.
          items:
            type: string
    CreateXmlTrustedListRequest:
      type: object
      required:
        - schemeOperatorName
        - schemeTerritory
        - schemeName
        - schemeOperatorStreet
        - schemeOperatorLocality
        - schemeOperatorCountry
        - schemeOperatorEmail
        - schemeOperatorWebsite
        - schemeInformationUri
        - nationalSchemeRulesUri
        - policyUri
        - lotlCertificatesBase64Der
        - lotlSchemeOperatorNames
        - keyFile
        - certFile
        - allowedServiceProfiles
      properties:
        schemeOperatorName:
          type: string
          description: >-
            Published as SchemeOperatorName. The signing certificate subject
            organisation must equal it exactly.
        schemeTerritory:
          type: string
          description: >-
            The responsible EU Member State as a 2-letter code. Never EU: a
            Member State list states its own territory.
        schemeName:
          type: string
          description: >-
            The Trusted List Name. It is published as SchemeName after the
            Scheme Territory and colon are added idempotently.
        schemeOperatorStreet:
          type: string
        schemeOperatorLocality:
          type: string
        schemeOperatorPostalCode:
          type: string
        schemeOperatorCountry:
          type: string
        schemeOperatorEmail:
          type: string
        schemeOperatorWebsite:
          type: string
        schemeOperatorTelephone:
          type: string
          description: >-
            Optional. Published as a tel: URI.
        schemeInformationUri:
          type: string
        nationalSchemeRulesUri:
          type: string
        policyUri:
          type: string
        distributionPointUri:
          type: string
          description: >-
            Optional stable URL at which the signed XML is published. When
            omitted or blank, the publisher derives the request's public
            origin plus /lists/{listKey}/latest/trusted-list.xml. An explicit
            URL is preserved.
        lotlCertificatesBase64Der:
          type: array
          description: >-
            Base64 DER signing certificates of the EU LOTL, with no PEM armour.
          items:
            type: string
        lotlSchemeOperatorNames:
          type: array
          items:
            type: string
        keyFile:
          type: string
          description: Server-side path to the signing private key.
        certFile:
          type: string
          description: Server-side path to the signing certificate.
        allowedServiceProfiles:
          type: array
          description: >-
            Which onboarding families this list accepts. One list may accept
            eaa-providers, qeaa-providers or both.
          items:
            type: string
            enum: [eaa-providers, qeaa-providers]
        defects:
          type: array
          description: >-
            Deliberate defect IDs from the canonical catalogue. Empty publishes
            a healthy list; a non-empty array publishes an intentionally broken
            test fixture. Only IDs the catalogue binds to ETSI TS 119 612 are
            accepted; an unknown one is rejected by name.
          items:
            type: string
        seedFixtureProvider:
          type: boolean
          description: >-
            Seed one deterministic provider so the service-level defects have
            something to mutate. Implied by a non-empty defects array; set it on
            a healthy list to publish the baseline those fixtures are a delta
            from.
        listKey:
          type: string
          description: >-
            Overrides the key derived from territory and operator name. Used by
            the deterministic fixture generator so a fixture can be published at
            a stable key such as eaa-broken-expired_next_update.
    CreateXmlTrustedListResponse:
      type: object
      properties:
        listKey:
          type: string
        standard:
          type: string
          enum: ["TS 119 612"]
        artifactFormat:
          type: string
          enum: ["XML / XAdES-B-B"]
        schemeName:
          type: string
        schemeTerritory:
          type: string
        allowedServiceProfiles:
          type: array
          items:
            type: string
        sequenceNumber:
          type: integer
        versionUrl:
          type: string
        xmlUrl:
          type: string
        sha2Url:
          type: string
        inspector:
          $ref: "#/components/schemas/InspectorSummary"
        intentionallyBroken:
          type: boolean
        defects:
          type: array
          items:
            type: string
        fixture:
          $ref: "#/components/schemas/FixtureMetadata"
    FixtureMetadata:
      type: object
      description: >-
        The evidence stored beside an intentionally broken version. It is
        format-independent: a TS 119 602 JSON fixture and a TS 119 612 XML one
        answer the same questions in the same document.
      properties:
        schemaVersion:
          type: integer
        fixtureMode:
          type: string
          enum: [healthy, intentionally-broken]
        standard:
          type: string
          enum: ["TS 119 602", "TS 119 612"]
        artifactFormat:
          type: string
          enum: ["JSON / JAdES", "XML / XAdES-B-B"]
        selectedDefects:
          type: array
          items:
            type: string
        mutations:
          type: array
          items:
            type: object
            properties:
              defectId:
                type: string
              stage:
                type: string
                enum: [pre-sign, post-sign, publication]
              applied:
                type: boolean
                description: >-
                  False when the mutation found nothing to change. A selected
                  defect is never silently repaired; it is recorded as not
                  applied, with the reason in detail.
              detail:
                type: string
        expectedFailures:
          $ref: "#/components/schemas/FixtureFailureSets"
        actualFailures:
          $ref: "#/components/schemas/FixtureFailureSets"
        matchedFailures:
          type: array
          items:
            type: string
        missingFailures:
          type: array
          description: Expected Trust Inspector rules that did not fail.
          items:
            type: string
        additionalFailures:
          type: array
          description: >-
            Rules that failed without being expected. Cascades live here: one
            mutation can trip several rules, and they are reported rather than
            hidden.
          items:
            type: string
        matchedLocalFailures:
          type: array
          items:
            type: string
        missingLocalFailures:
          type: array
          items:
            type: string
        additionalLocalFailures:
          type: array
          items:
            type: string
        knownUnrelatedFailures:
          type: array
          items:
            type: string
        generatedAt:
          type: string
    FixtureFailureSets:
      type: object
      description: Failures split by who decided them.
      properties:
        local:
          type: array
          description: >-
            Stable local check IDs, such as local.xml.schema,
            local.xades.signature, local.signing_certificate.profile,
            local.freshness and local.sha2.digest.
          items:
            type: string
        inspector:
          type: array
          description: >-
            Trust Inspector failure lines, in the form "ruleId: message".
          items:
            type: string
    CreateTrustedListResponse:
      type: object
      properties:
        listKey:
          type: string
        family:
          type: string
        schemeName:
          type: string
        schemeTerritory:
          type: string
        sequenceNumber:
          type: integer
        versionUrl:
          type: string
        inspector:
          $ref: "#/components/schemas/InspectorSummary"
    InspectorSummary:
      type: object
      properties:
        status:
          type: string
          enum: [pass, fail, unavailable]
          description: >-
            Unavailable means the Inspector could not be reached and is never a
            conformance statement.
        error:
          type: string
        evaluatedAt:
          type: string
        inspectorBaseUrl:
          type: string
        profile:
          type: string
        profileStatus:
          type: string
        detectedFormat:
          type: string
        detectedArtifactKind:
          type: string
        conformanceLevel:
          type: string
        score:
          type: number
          nullable: true
        counts:
          type: object
          properties:
            pass:
              type: integer
            fail:
              type: integer
            warn:
              type: integer
            notApplicable:
              type: integer
            notChecked:
              type: integer
            other:
              type: integer
        locallyDecidableFailures:
          type: array
          items:
            type: string
        mandatoryFailures:
          type: array
          items:
            type: string
    InspectorEvaluation:
      type: object
      properties:
        schemaVersion:
          type: integer
        summary:
          $ref: "#/components/schemas/InspectorSummary"
        report:
          type: object
          description: Complete, unmodified Trust Inspector response.
          additionalProperties: true
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: The TLP_ADMIN_TOKEN value.
security: []
